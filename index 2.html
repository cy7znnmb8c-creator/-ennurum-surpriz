<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ennurum ❤️</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}
body{background:linear-gradient(135deg,#ffd8e8,#eadcff,#fff0c9);overflow-x:hidden;color:#fff}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;filter:blur(.5px)}
.bg span{position:absolute;opacity:.5;font-size:42px;animation:float 6s ease-in-out infinite}
.s1{left:5%;top:8%}.s2{right:7%;top:15%}.s3{left:7%;bottom:10%}.s4{right:5%;bottom:12%}.s5{left:15%;top:45%}.s6{right:15%;top:55%}
.wrap{position:relative;z-index:2;width:min(92%,520px);margin:auto;padding:35px 0 60px}
.card{padding:28px 20px;border-radius:30px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.65);backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(90,35,80,.25);text-align:center}
h1{font:italic 48px Georgia;margin:0 0 8px;text-shadow:0 3px 15px rgba(90,20,70,.4)}
.sub{font-size:15px;margin-bottom:28px}
.btn{width:90%;max-width:350px;border:0;border-radius:50px;padding:17px;margin:10px auto;display:block;background:linear-gradient(135deg,#ff4f9b,#a957e8);color:#fff;font-weight:bold;font-size:18px;box-shadow:0 9px 24px rgba(160,50,140,.3)}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.7}
.hidden{display:none!important}.photo{width:100%;max-height:65vh;object-fit:contain;border-radius:22px;margin-top:12px;box-shadow:0 12px 35px #0004}
.note{font-size:13px;opacity:.85;margin:6px 0 14px}
#words{height:180px;position:relative;overflow:hidden;border-radius:24px;background:rgba(70,20,60,.18);margin-top:12px}
.word{position:absolute;font-weight:800;font-size:24px;opacity:0;animation:fly 2.4s ease-out forwards;text-shadow:0 2px 8px #0005}
@keyframes fly{0%{opacity:0;transform:translateY(130px) rotate(-15deg)}20%{opacity:1}100%{opacity:1;transform:translate(var(--x),20px) rotate(var(--r))}}
@keyframes float{50%{transform:translateY(-14px) rotate(6deg)}}
</style>
</head>
<body>
<div class="bg">
<span class="s1">🦋</span><span class="s2">🌸</span><span class="s3">🌹</span><span class="s4">🌼</span><span class="s5">❤️</span><span class="s6">💗</span>
</div>
<div class="wrap"><div class="card">
<h1>Ennurum ❤️</h1>
<div class="sub">Aşkım • balım • bebeğim • çiçeğim • güzelim • bitanem</div>

<button class="btn" id="love">Beni Seviyorsan Tıkla ❤️</button>
<div id="musicText" class="note hidden">🎵 Şarkımız başladı...</div>

<button class="btn hidden" id="photoButton">Fotoğrafımıza Bak 🥰</button>
<div id="photoArea" class="hidden">
<img class="photo" src="photo.jpg" alt="Bizim fotoğrafımız">
</div>

<button class="btn hidden" id="wordButton">Bir Şey Daha Var ❤️</button>
<div id="words" class="hidden"></div>
</div></div>

<script>
(function(){
const love=document.getElementById('love');
const musicText=document.getElementById('musicText');
const photoButton=document.getElementById('photoButton');
const photoArea=document.getElementById('photoArea');
const wordButton=document.getElementById('wordButton');
const words=document.getElementById('words');

let audioCtx=null;
function startMusic(){
 try{
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  const notes=[261.63,329.63,392,523.25,392,329.63,293.66,349.23,440,523.25,440,349.23];
  notes.forEach((freq,i)=>{
   const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
   osc.type='sine'; osc.frequency.value=freq;
   const t=audioCtx.currentTime+i*.45;
   gain.gain.setValueAtTime(.0001,t);
   gain.gain.exponentialRampToValueAtTime(.06,t+.04);
   gain.gain.exponentialRampToValueAtTime(.0001,t+.4);
   osc.connect(gain);gain.connect(audioCtx.destination);
   osc.start(t);osc.stop(t+.42);
  });
 }catch(e){}
}

love.addEventListener('click',function(){
 startMusic();
 love.disabled=true;
 love.textContent='Müzik başladı ❤️';
 musicText.classList.remove('hidden');
 photoButton.classList.remove('hidden');
});

photoButton.addEventListener('click',function(){
 photoArea.classList.remove('hidden');
 photoButton.classList.add('hidden');
 wordButton.classList.remove('hidden');
 photoArea.scrollIntoView({behavior:'smooth',block:'center'});
});

wordButton.addEventListener('click',function(){
 wordButton.classList.add('hidden');
 words.classList.remove('hidden');
 words.innerHTML='';
 const parts=['Planı','iptal','edersek','ölecekmişiz','😂❤️'];
 parts.forEach((txt,i)=>{
  const s=document.createElement('span');
  s.className='word';s.textContent=txt;
  s.style.left=(8+i*18)+'%';
  s.style.bottom=(15+(i%2)*25)+'px';
  s.style.setProperty('--x',(i%2?'25px':'-25px'));
  s.style.setProperty('--r',(i%2?'7deg':'-7deg'));
  s.style.animationDelay=(i*.22)+'s';
  words.appendChild(s);
 });
});
})();
</script>
</body>
</html>
