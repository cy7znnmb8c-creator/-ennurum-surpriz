<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ennurum ❤️</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:linear-gradient(135deg,#fff1f7,#ffe4ef,#fff8fb);
    display:flex; align-items:center; justify-content:center;
    color:#7a244b;
  }
  .bg{position:fixed;inset:0;filter:blur(2px);opacity:.8;pointer-events:none}
  .heart,.flower,.butterfly{position:absolute;font-size:24px;animation:float 7s linear infinite}
  .heart{color:#ff6f9f}.flower{font-size:22px}.butterfly{font-size:25px}
  .heart:nth-child(1){left:8%;top:12%}.heart:nth-child(2){left:80%;top:20%;animation-delay:1s}
  .flower:nth-child(3){left:15%;top:72%;animation-delay:2s}.flower:nth-child(4){left:82%;top:75%;animation-delay:3s}
  .butterfly:nth-child(5){left:48%;top:8%;animation-delay:1.5s}.butterfly:nth-child(6){left:55%;top:84%;animation-delay:4s}
  @keyframes float{50%{transform:translateY(-22px) rotate(8deg);opacity:.55}}
  .card{
    width:min(92vw,430px); max-height:90vh; overflow:auto;
    background:rgba(255,255,255,.82); backdrop-filter:blur(12px);
    border:1px solid rgba(255,150,190,.3); border-radius:28px;
    padding:28px 20px; text-align:center; box-shadow:0 15px 45px rgba(140,45,90,.16);
  }
  h1{font-size:28px;margin:0 0 10px}.sub{margin:0 0 24px;font-size:16px}
  button{
    width:100%; border:0; border-radius:18px; padding:16px 18px;
    margin:8px 0; font-size:17px; font-weight:700; cursor:pointer;
    background:#ff6f9f; color:white; box-shadow:0 8px 18px rgba(255,111,159,.25);
  }
  button.secondary{background:#fff;color:#a52d61;border:1px solid #ffc0d6}
  .hidden{display:none}
  .photo{width:100%;border-radius:20px;display:block;margin:12px 0;box-shadow:0 8px 25px rgba(0,0,0,.12)}
  #message{
    min-height:150px; display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden; margin-top:12px;
  }
  .word{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    font-size:clamp(20px,6vw,30px); font-weight:800; white-space:nowrap;
    animation:dance 1.7s ease-in-out infinite;
  }
  .word:nth-child(2){animation-delay:.18s}.word:nth-child(3){animation-delay:.36s}
  .word:nth-child(4){animation-delay:.54s}.word:nth-child(5){animation-delay:.72s}
  @keyframes dance{
    0%,100%{transform:translate(-50%,-50%) rotate(-4deg) scale(1)}
    50%{transform:translate(-50%,-50%) rotate(4deg) scale(1.12)}
  }
  .final{
    width:100%;
    padding:18px 10px;
    text-align:center;
    font-size:clamp(21px,6vw,28px);
    font-weight:900;
    line-height:1.4;
    white-space:normal;
    overflow-wrap:anywhere;
    word-break:normal;
    animation:pop 1.2s ease-in-out infinite alternate;
  }
  @keyframes pop{to{transform:scale(1.05) rotate(1deg)}}
</style>
</head>
<body>
<div class="bg">
  <div class="heart">♥</div><div class="heart">♥</div>
  <div class="flower">🌼</div><div class="flower">🌸</div>
  <div class="butterfly">🦋</div><div class="butterfly">🦋</div>
</div>

<main class="card">
  <section id="start">
    <h1>Ennurum ❤️</h1>
    <p class="sub">Güzelim, güzel gözlüm, hayatım, aşkım, bebeğim, bitanem...</p>
    <button id="loveBtn">Beni Seviyorsan Tıkla ❤️</button>
  </section>

  <section id="photoStep" class="hidden">
    <h1>Bir şey daha var... 🥰</h1>
    <p class="sub">Hazırsan fotoğrafımıza bakalım.</p>
    <button id="photoBtn">Fotoğrafımıza Bak 📸</button>
    <div id="photoArea" class="hidden">
      <img class="photo" src="fotoğraf.jpg" alt="Biz ❤️">
      <button id="messageBtn" class="secondary">Bir Şey Daha Var ❤️</button>
    </div>
  </section>

  <section id="words" class="hidden">
    <div id="message">
      <div class="word">seviyorum ❤️</div>
      <div class="word">aşkım 💕</div>
      <div class="word">balım 🥰</div>
      <div class="word">bebeğim 🌸</div>
      <div class="word">çiçeğim 🦋</div>
    </div>
    <button id="finalBtn">Son bir şey... 💌</button>
    <div id="final" class="hidden final">PLANI İPTAL EDERSEK ÖLECEKMİŞİZ 😂❤️</div>
  </section>
</main>

<audio id="music" src="asil-gok-noldu-boyle-94.mp3" preload="auto"></audio>

<script>
const $ = id => document.getElementById(id);
$("loveBtn").onclick = () => {
  $("music").play().catch(()=>{});
  $("start").classList.add("hidden");
  $("photoStep").classList.remove("hidden");
};
$("photoBtn").onclick = () => $("photoArea").classList.remove("hidden");
$("messageBtn").onclick = () => {
  $("photoStep").classList.add("hidden");
  $("words").classList.remove("hidden");
};
$("finalBtn").onclick = () => {
  $("finalBtn").classList.add("hidden");
  $("final").classList.remove("hidden");
};
</script>
</body>
</html>
