<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ennurum ❤️</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:18px;overflow:auto;color:#7a244b;
  background:linear-gradient(135deg,#fff1f7,#ffe4ef,#fff8fb);
}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;filter:blur(1.5px)}
.bg span{position:absolute;font-size:25px;opacity:.65;animation:float 7s ease-in-out infinite}
.bg span:nth-child(1){left:8%;top:14%}.bg span:nth-child(2){right:10%;top:22%;animation-delay:1s}
.bg span:nth-child(3){left:13%;bottom:16%;animation-delay:2s}.bg span:nth-child(4){right:12%;bottom:20%;animation-delay:3s}
.bg span:nth-child(5){left:48%;top:8%;animation-delay:1.5s}.bg span:nth-child(6){right:42%;bottom:7%;animation-delay:4s}
@keyframes float{50%{transform:translateY(-18px) rotate(8deg)}}

.card{
  position:relative;z-index:2;width:min(94vw,440px);min-height:520px;
  background:rgba(255,255,255,.9);backdrop-filter:blur(12px);
  border:1px solid rgba(255,150,190,.3);border-radius:30px;
  padding:28px 20px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 18px 50px rgba(140,45,90,.16);text-align:center;
}
section{width:100%}
.hidden{display:none!important}
h1{font-size:29px;line-height:1.2;margin:0 0 10px}
.sub{font-size:17px;line-height:1.5;margin:0 0 22px}
button{
 width:100%;border:0;border-radius:18px;padding:16px 18px;margin:8px 0;
 font-size:17px;font-weight:800;cursor:pointer;background:#f76599;color:#fff;
 box-shadow:0 8px 18px rgba(247,101,153,.25)
}
button.secondary{background:#fff;color:#a52d61;border:1px solid #ffc0d6;box-shadow:none}

.photo{
 width:100%;max-height:52vh;object-fit:contain;border-radius:20px;display:block;
 margin:14px auto;box-shadow:0 8px 25px rgba(0,0,0,.12)
}

#message{
 min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;
 gap:7px;padding:12px 4px;overflow:hidden
}
.word{
 position:relative;display:block;width:max-content;max-width:100%;
 font-size:clamp(22px,7vw,31px);font-weight:900;line-height:1.15;
 white-space:nowrap;animation:wordDance 1.8s ease-in-out infinite;
}
.word:nth-child(2){animation-delay:.18s}.word:nth-child(3){animation-delay:.36s}
.word:nth-child(4){animation-delay:.54s}.word:nth-child(5){animation-delay:.72s}
@keyframes wordDance{
  0%,100%{transform:translateX(0) rotate(-2deg) scale(1)}
  50%{transform:translateX(0) rotate(2deg) scale(1.08)}
}

.final{
 margin:0 auto;padding:8px 4px;max-width:100%;
 font-size:clamp(22px,7vw,31px);font-weight:950;line-height:1.25;
 text-align:center;white-space:normal;overflow-wrap:normal;word-break:normal;
 animation:finalDance 1.1s ease-in-out infinite alternate
}
@keyframes finalDance{
 from{transform:scale(1) rotate(-1deg)}to{transform:scale(1.04) rotate(1deg)}
}
</style>
</head>
<body>
<div class="bg">
<span>♥</span><span>♥</span><span>🌼</span><span>🌸</span><span>🦋</span><span>🦋</span>
</div>

<main class="card">
<section id="start">
<h1>Ennurum ❤️</h1>
<p class="sub">Güzelim, güzel gözlüm, hayatım, aşkım, bebeğim, bitanem...</p>
<button id="loveBtn">Beni Seviyorsan Tıkla ❤️</button>
</section>

<section id="photoStep" class="hidden">
<h1>Bir şey daha var... 🥰</h1>
<p class="sub">Hazırsan fotoğrafımıza bakalım.</p>
<button id="photoBtn">Fotoğrafımıza Bak 📸</button>
<div id="photoArea" class="hidden">
<img class="photo" src="foto.jpg" alt="Biz ❤️">
<button id="messageBtn" class="secondary">Bir Şey Daha Var ❤️</button>
</div>
</section>

<section id="words" class="hidden">
<div id="message">
<div class="word">seviyorum ❤️</div>
<div class="word">aşkım 💕</div>
<div class="word">balım 🥰</div>
<div class="word">bebeğim 🌸</div>
<div class="word">çiçeğim 🦋</div>
</div>
<button id="finalBtn">Son bir şey... 💌</button>
<div id="final" class="hidden final">PLANI İPTAL EDERSEK<br>ÖLECEKMİŞİZ 😂❤️</div>
</section>
</main>

<audio id="music" src="muzik.mp3" preload="auto"></audio>
<script>
const $=id=>document.getElementById(id);
$("loveBtn").onclick=()=>{
  const m=$("music"); m.currentTime=0; m.play().catch(()=>{});
  $("start").classList.add("hidden"); $("photoStep").classList.remove("hidden");
};
$("photoBtn").onclick=()=> $("photoArea").classList.remove("hidden");
$("messageBtn").onclick=()=>{ $("photoStep").classList.add("hidden"); $("words").classList.remove("hidden"); };
$("finalBtn").onclick=()=>{ $("finalBtn").classList.add("hidden"); $("final").classList.remove("hidden"); };
</script>
</body>
</html>
