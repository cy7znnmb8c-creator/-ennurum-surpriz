<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ennurum 🌼</title>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;overflow:hidden;
font-family:Georgia,serif;background:linear-gradient(145deg,#fffaf0,#fff1c9);
display:flex;align-items:center;justify-content:center;color:#5b4636}
.card{width:min(90%,520px);padding:42px 28px;text-align:center;border-radius:30px;
background:rgba(255,255,255,.78);box-shadow:0 12px 50px rgba(90,60,20,.15);
backdrop-filter:blur(8px);position:relative;z-index:2}
.flower{font-size:58px;animation:float 3s ease-in-out infinite}
h1{font-size:27px;margin:15px 0 25px;font-weight:500}
p{font-size:19px;line-height:1.7;margin:13px 0}
.end{font-size:22px;margin-top:27px}
.hearts{position:fixed;inset:0;pointer-events:none;z-index:1}
.heart{position:absolute;font-size:22px;animation:rise 7s linear infinite;opacity:0}
.tap{margin-top:22px;font-size:13px;opacity:.65}
@keyframes rise{0%{transform:translateY(20vh) scale(.7);opacity:0}
15%{opacity:.7}100%{transform:translateY(-110vh) scale(1.4);opacity:0}}
@keyframes float{50%{transform:translateY(-7px)}}
</style>
</head>
<body>
<div class="hearts" id="hearts"></div>
<div class="card">
  <div class="flower">🌼</div>
  <h1>Bir fotoğrafımız yok henüz… ❤️</h1>
  <p>Ama belki bu, birlikte biriktireceğimiz güzel anıların ilk sayfasıdır.</p>
  <p>İlk buluşmamızın hatırası olsun.<br>Umarım bu papatyalar gibi, aramızdaki güzel şeyler de hep büyür. 🌼</p>
  <div class="end"><b>Daha nice güzel anılara, Ennurum… ❤️</b></div>
  <div class="tap" id="tap">Müzik otomatik başlamazsa ekrana bir kez dokun. ❤️</div>
</div>
<audio id="music" src="neyleyim_giris.mp3" autoplay playsinline></audio>
<script>
const box=document.getElementById('hearts');
for(let i=0;i<18;i++){
  const h=document.createElement('div'); h.className='heart'; h.textContent='❤️';
  h.style.left=(Math.random()*100)+'%';
  h.style.bottom=(-10-Math.random()*30)+'%';
  h.style.animationDelay=(Math.random()*6)+'s';
  h.style.animationDuration=(5+Math.random()*5)+'s';
  box.appendChild(h);
}
const music=document.getElementById('music');
music.volume=.45;
function start(){music.play().then(()=>document.getElementById('tap').style.display='none').catch(()=>{});}
start();
document.body.addEventListener('click',start,{once:true});
document.body.addEventListener('touchstart',start,{once:true});
</script>
</body>
</html>
